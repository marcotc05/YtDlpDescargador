name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Guardar APKs como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: YT-DLP-Descargador-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publicar en Releases (descarga directa desde el celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-version
          name: Última versión
          prerelease: true
          files: app/build/outputs/apk/release/*.apk
