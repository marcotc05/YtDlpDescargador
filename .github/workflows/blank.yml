name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # CR?TICO: 20 min es insuficiente. 60 da margen al primer build (sin cach?).
    timeout-minutes: 60

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.internal.http.connectionTimeout=60000
        -Dorg.gradle.internal.http.socketTimeout=60000
        -Dorg.gradle.workers.max=2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Ensure Gradle Wrapper
        run: |
          set -e
          if [ ! -f "gradlew" ] \
             || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ] \
             || [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::warning::Wrapper incompleto; regenerando con Gradle 8.7"
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew assembleDebug -x lint --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
