name: DownAll Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: downall-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx3584m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC' -Dorg.gradle.workers.max=2"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Compile and Assemble APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx3584m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DownAll-APKs
          path: app/build/outputs/apk/**/*.apk